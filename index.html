let ans={};try{ans=JSON.parse(localStorage.getItem('fq6')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('fq6',JSON.stringify(ans))}catch(e){}};
const sel=document.getElementById('sec'),list=document.getElementById('list');
sel.innerHTML='<option value="-1">تمام حصے (300)</option>'+SECS.map((s,i)=>`<option value="${i}">${i+1}. ${s.t} (${s.q.length})</option>`).join('');
function stats(){let o=0,b=0,t=0;SECS.forEach(s=>s.q.forEach(q=>{t++;const a=ans[q.n];if(a!=null){a===q.a?o++:b++}}));
 document.getElementById('ok').textContent=o;document.getElementById('bad').textContent=b;document.getElementById('tot').textContent=(o+b)+'/'+t}
function paint(card,q){const a=ans[q.n];card.querySelectorAll('.o').forEach((btn,i)=>{btn.disabled=a!=null;btn.classList.remove('ok','bad');
 if(a!=null){if(i===q.a)btn.classList.add('ok');else if(i===a)btn.classList.add('bad')}})}
function render(){const v=+sel.value;list.innerHTML='';
 SECS.forEach((s,si)=>{if(v>=0&&v!==si)return;const h=document.createElement('div');h.className='sec';h.textContent=`حصہ ${si+1} — ${s.t}`;list.appendChild(h);
  s.q.forEach(q=>{const c=document.createElement('div');c.className='q';
   const p=document.createElement('p');p.className='qt';p.textContent=q.q;const n=document.createElement('span');n.className='n';n.textContent='Q'+q.n;p.prepend(n);c.appendChild(p);
   const g=document.createElement('div');g.className='opts';
   q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='o';b.type='button';b.innerHTML='<span class="l">'+'ABCD'[i]+'</span><span class="t"></span>';b.lastChild.textContent=t;
    b.onclick=()=>{if(ans[q.n]!=null)return;ans[q.n]=i;save();paint(c,q);stats()};g.appendChild(b)});
   c.appendChild(g);list.appendChild(c);paint(c,q)})});
 document.getElementById('end').textContent='';stats();window.scrollTo(0,0)}
sel.onchange=render;
document.getElementById('reset').onclick=()=>{ans={};save();render()};
render();
</script>
