            { id: 279, q: "لِمَ تَقُولُونَ", o: ["تم کیا کہتے ہو", "تم کیوں کہتے ہو", "تم نہیں کہتے"], a: "تم کیوں کہتے ہو" },
            { id: 280, q: "لِمَ تَفْعَلُونَ", o: ["تم کیسے کرتے ہو", "تم کیوں کرتے ہو", "تم نہیں کرتے"], a: "تم کیوں کرتے ہو" },
            { id: 281, q: "لَا تَعْلَمُونَ میں (لَا) کس مفہوم کے لیے ہے؟", o: ["تاکید", "نفی (نہیں)", "سوال"], a: "نفی (نہیں)" },
            { id: 282, q: "لَوْلَا تَسْتَغْفِرُونَ اللهَ", o: ["تم اللہ سے استغفار کرتے ہو", "تم اللہ سے استغفار کیوں نہیں کرتے", "اللہ استغفار قبول کرتا ہے"], a: "تم اللہ سے استغفار کیوں نہیں کرتے" },
            { id: 283, q: "لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ", o: ["تم وہ کرتے ہو جو تم کہتے ہو", "تم وہ کیوں کہتے ہو جو تم نہیں کرتے", "وہ وہی کہتے ہیں جو کرتے ہیں"], a: "تم وہ کیوں کہتے ہو جو تم نہیں کرتے" },
            { id: 284, q: "لِمَ کا اردو مطلب ہے:", o: ["کیا", "کیوں", "کون"], a: "کیوں" },
            { id: 285, q: "لَا تَعْلَمُونَ", o: ["تم جانتے ہو", "تم نہیں جانتے", "وہ نہیں جانتے"], a: "تم نہیں جانتے" },
            { id: 286, q: "أَعْبُدُ", o: ["میں عبادت کرتا ہوں", "میں چاہتا ہوں", "میں جانتا ہوں"], a: "میں عبادت کرتا ہوں" },
            { id: 287, q: "أَسْتَغْفِرُ", o: ["میں چاہتا ہوں", "میں استغفار کرتا ہوں", "میں سوال کرتا ہوں"], a: "میں استغفار کرتا ہوں" },
            { id: 288, q: "أَخَافُ", o: ["میں جانتا ہوں", "میں ڈرتا ہوں", "میں عبادت کرتا ہوں"], a: "میں ڈرتا ہوں" },
            { id: 289, q: "أَقُولُ", o: ["میں پناہ مانگتا ہوں", "میں کہتا ہوں", "میں نصیحت کرتا ہوں"], a: "میں کہتا ہوں" },
            { id: 290, q: "أُرِيدُ", o: ["میں کہتا ہوں", "میں چاہتا ہوں", "میں پکارتا ہوں"], a: "میں چاہتا ہوں" },
            { id: 291, q: "أَعُوذُ", o: ["أَتُوبُ", "أَنْصَحُ", "أَعُوذُ"], a: "أَعُوذُ" },
            { id: 292, q: "أَدْعُو", o: ["میں پناہ مانگتا ہوں", "میں پکارتا ہوں", "میں عمل کرتا ہوں"], a: "میں پکارتا ہوں" },
            { id: 293, q: "أَعْلَمُ", o: ["میں جانتا ہوں", "میں کہتا ہوں", "میں استغفار کرتا ہوں"], a: "میں جانتا ہوں" },
            { id: 294, q: "أَنْصَحُ", o: ["میں جانتا ہوں", "میں نصیحت کرتا ہوں", "میں کہتا ہوں"], a: "میں نصیحت کرتا ہوں" },
            { id: 295, q: "أَتُوبُ", o: ["میں چاہتا ہوں", "میں توبہ کرتا ہوں", "میں نصیحت کرتا ہوں"], a: "میں توبہ کرتا ہوں" },
            { id: 296, q: "فعل مضارع کے شروع میں (أ) (ہمزہ) آنے سے فاعل کون بن جاتا ہے؟", o: ["ہم", "میں", "تم"], a: "میں" },
            { id: 297, q: "أَعْبُدُ، أَخَافُ اور أَقُولُ کس صیغے کے افعال ہیں؟", o: ["متکلم جمع (ہم)", "متکلم واحد (میں)", "مخاطب (تم)"], a: "متکلم واحد (میں)" },
            { id: 298, q: "أُقْسِمُ", o: ["ہم قسم کھاتے ہیں", "میں قسم کھاتا ہوں", "تم قسم کھاتے ہو"], a: "میں قسم کھاتا ہوں" },
            { id: 299, q: "لَا أُقْسِمُ بِهَذَا الْبَلَدِ", o: ["میں اس شہر میں نہیں رہتا", "میں اس شہر کی قسم کھاتا ہوں", "میں اس شہر کی قسم نہیں کھاتا"], a: "میں اس شہر کی قسم کھاتا ہوں" },
            { id: 300, q: "أَدْعُوكُمْ", o: ["میں انہیں بلاتا ہوں", "میں تمہیں بلاتا ہوں", "وہ تمہیں بلاتا ہے"], a: "میں تمہیں بلاتا ہوں" }
        ];

        let score = 0;
        const container = document.getElementById('quiz-container');
        const scoreDisplay = document.getElementById('score');
        const totalDisplay = document.getElementById('total');

        totalDisplay.textContent = quizData.length;

        function renderQuiz() {
            let html = '';
            quizData.forEach((q, index) => {
                html += `<div class="mcq" id="q${q.id}">`;
                html += `<div class="question-text">سوال ${q.id}: ${q.q}</div>`;
                
                q.o.forEach((option, optIndex) => {
                    const letter = String.fromCharCode(65 + optIndex); // A, B, C
                    html += `<div class="option" onclick="checkAnswer(this, '${q.a}', '${option}')">${letter}) ${option}</div>`;
                });
                
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function checkAnswer(element, correctAnswer, selectedOption) {
            const parent = element.parentElement;
            
            if (parent.classList.contains('answered')) {
                return;
            }
            parent.classList.add('answered');

            const options = parent.querySelectorAll('.option');
            options.forEach(opt => {
                const optText = opt.textContent.substring(3); // Remove "A) "
                if (optText === correctAnswer) {
                    opt.classList.add('correct');
                }
            });

            if (selectedOption !== correctAnswer) {
                element.classList.add('incorrect');
            } else {
                score++;
                scoreDisplay.textContent = score;
            }
        }

        renderQuiz();
    </script>
